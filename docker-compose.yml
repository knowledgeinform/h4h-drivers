  keyboard-debug-input:
    image: zmq-input:${DOCKER_IMAGE_TAG}
    build:
      dockerfile: dockerfiles/controllers/zmq_input.dockerfile
      args:
        IMAGE_TAG: ${DOCKER_IMAGE_TAG}
    restart: no
    network_mode: host
    ipc: host
    environment:
