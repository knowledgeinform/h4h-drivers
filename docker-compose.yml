  ### Vehicle Interfaces

  # Mavlink UAV
  mav-uav-controller-c100:
    image: mav-uav-controller:${DOCKER_IMAGE_TAG}
    build:
      dockerfile: dockerfiles/vehicles/mav_uav.dockerfile
      args:
        IMAGE_TAG: ${DOCKER_IMAGE_TAG}
    restart: no
    network_mode: host
    ipc: host
    environment:
      ROS_NAMESPACE: "h4h_rad_c100"
      MAV_ADDRESS: "udpin:0.0.0.0:14542" # serial or IP address # udpin:0.0.0.0:14550 is specifically how QGC connects to things
      MAX_HORIZ_SPEED: 1000 # no unit [0,1000]
      MAX_VERT_SPEED: 500 # no unit [0,500]
      MAX_TURN_SPEED: 800 # no unit [0,1000]  
      BAUDRATE: 0 # frequency (only matters for serial connections)
      TAKEOFF_HEIGHT_METERS: 10
      FLIGHT_CONTROL_IS_PX4: True
      DISABLE_FAILSAFE: True
      STATUS_PORT: 5561
      VISION_PORT: 5591

  # Mavlink UAV
  mav-uav-controller-teal:
    image: mav-uav-controller:${DOCKER_IMAGE_TAG}
    build:
      dockerfile: dockerfiles/vehicles/mav_uav.dockerfile
      args:
        IMAGE_TAG: ${DOCKER_IMAGE_TAG}
    restart: no
    network_mode: host
    ipc: host
    environment:
      ROS_NAMESPACE: "h4h_rad_teal"
      MAV_ADDRESS: "udpin:0.0.0.0:14541" # serial or IP address # udpin:0.0.0.0:14550 is specifically how QGC connects to things
      MAX_HORIZ_SPEED: 1000 # no unit [0,1000]
      MAX_VERT_SPEED: 500 # no unit [0,500]
      MAX_TURN_SPEED: 800 # no unit [0,1000]  
      BAUDRATE: 0 # frequency (only matters for serial connections)
      TAKEOFF_HEIGHT_METERS: 10
      FLIGHT_CONTROL_IS_PX4: True
      DISABLE_FAILSAFE: True
      STATUS_PORT: 5562
      VISION_PORT: 5592

