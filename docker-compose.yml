  # this container spins up a PX4 SITL (connect via QGCS)
  # it rebuilds the SITL code every time it spins up so it's very slow to start
  h4h-px4-sim:
    image: h4h-sim-base:${DOCKER_IMAGE_TAG}
    build:
      dockerfile: dockerfiles/h4h-sim-base.dockerfile
      args:
        IMAGE_TAG: ${DOCKER_IMAGE_TAG}
    # command: /bin/bash -c "cd PX4-Autopilot; make px4_sitl gz_x500"
    command: /bin/bash -c "cd PX4-Autopilot; PX4_SYS_AUTOSTART=4001 PX4_SIM_MODEL=gz_x500 ./build/px4_sitl_default/bin/px4 -i 1"
    restart: no
    network_mode: host
    ipc: host
    # runtime: nvidia # comment this out for machines that don't have nvidia gpu's
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      DISPLAY: ":1"
    profiles: ["sim"]

  # this container spins up a PX4 SITL (connect via QGCS)
  # it rebuilds the SITL code every time it spins up so it's very slow to start
  h4h-px4-sim-2:
    image: h4h-sim-base:${DOCKER_IMAGE_TAG}
    build:
      dockerfile: dockerfiles/h4h-sim-base.dockerfile
      args:
        IMAGE_TAG: ${DOCKER_IMAGE_TAG}
    # command: /bin/bash -c "cd PX4-Autopilot; make px4_sitl gz_x500"
    command: /bin/bash -c "cd PX4-Autopilot; PX4_GZ_STANDALONE=1 PX4_SYS_AUTOSTART=4001 PX4_GZ_MODEL_POSE="0,1" PX4_SIM_MODEL=gz_x500 ./build/px4_sitl_default/bin/px4 -i 2"
    restart: no
    network_mode: host
    ipc: host
    # runtime: nvidia # comment this out for machines that don't have nvidia gpu's
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      DISPLAY: ":1"
    profiles: ["sim"]

